services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Falta de memória na VPS: o kernel mata processos de editor/assistente antes do banco (21/10/2026, aprovado pelo Marco).
    oom_score_adj: -500
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # só localhost: acesse via túnel SSH (DBeaver etc.), nunca exponha publicamente
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    oom_score_adj: -500
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # SEG09: senha mesmo sem porta publicada (defesa em profundidade)
    # INV14: persistência ligada; a fila não some se o Redis reiniciar
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      retries: 10

  # Recepção/API: valida, grava e agenda. Com FILA_DURAVEL=off, também processa
  # pelo agendador em processo (caminho atual); com on, não processa nada.
  gateway:
    build: ./app
    restart: unless-stopped
    oom_score_adj: -300
    # Parada graciosa: termina os lotes em andamento (PARADA_GRACIOSA_S, padrão 75 s).
    stop_grace_period: 90s
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "127.0.0.1:8100:8000"
    # SEG09: sem escrita no sistema de arquivos do container e sem novos privilégios
    read_only: true
    tmpfs:
      - /tmp
    # ARQ1-a1: documentos cifrados (volume privado) e a rede interna do leitor.
    volumes:
      - arquivos:/dados/arquivos
    networks:
      - default
      - leitor
    security_opt:
      - no-new-privileges:true
    # Sem nenhuma capacidade do kernel (o processo já roda sem root).
    cap_drop:
      - ALL
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Fila durável (Fase 0.6): mesma imagem da recepção. Com FILA_DURAVEL=off sobem,
  # dão sinal de vida e mostram indicadores, mas não consomem nem agendam nada.
  worker:
    image: gateway-gateway
    pull_policy: never
    oom_score_adj: -300
    command: ["python", "processos.py", "worker"]
    restart: unless-stopped
    # Parada graciosa: termina os lotes em andamento (PARADA_GRACIOSA_S, padrão 75 s).
    stop_grace_period: 90s
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    deploy:
      replicas: ${WORKERS:-2}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - arquivos:/dados/arquivos
    networks:
      - default
      - leitor
    security_opt:
      - no-new-privileges:true
    # Sem nenhuma capacidade do kernel (o processo já roda sem root).
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time;sys.exit(0 if time.time()-os.path.getmtime('/tmp/gateway-vivo')<30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agendador:
    image: gateway-gateway
    pull_policy: never
    oom_score_adj: -300
    command: ["python", "processos.py", "agendador"]
    restart: unless-stopped
    # Parada graciosa: termina os lotes em andamento (PARADA_GRACIOSA_S, padrão 75 s).
    stop_grace_period: 20s
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - arquivos:/dados/arquivos
    networks:
      - default
      - leitor
    security_opt:
      - no-new-privileges:true
    # Sem nenhuma capacidade do kernel (o processo já roda sem root).
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time;sys.exit(0 if time.time()-os.path.getmtime('/tmp/gateway-vivo')<30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ARQ1-a1: leitor de documentos. Rede interna sem saída para a internet, sem credencial nenhuma (só o token que o identifica para
  # o gateway), sistema de arquivos somente leitura, um documento por vez, teto de memória e CPU. Não alcança banco nem Redis.
  leitor:
    build: ./leitor
    image: gateway-leitor
    restart: unless-stopped
    environment:
      LEITOR_TOKEN: ${LEITOR_TOKEN:-}
    networks:
      - leitor
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Sem nenhuma capacidade do kernel (o processo já roda sem root).
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/saude',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  redisdata:
  # ARQ1-a1: documentos recebidos, cifrados (a chave mestra fica no .env, fora do volume).
  arquivos:

networks:
  leitor:
    internal: true
