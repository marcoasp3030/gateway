# Trecho para o server {} do domínio público (HTTPS) — ADICIONAR, sem alterar outros blocos.
# Depois: sudo nginx -t && sudo systemctl reload nginx
#
# Princípio (SEG02): só o que precisa ser público passa. Todo o resto do gateway
# (/admin, /test, /metricas, /docs...) NÃO é acessível pelo domínio. O painel web
# chama o gateway direto pela rede interna: http://127.0.0.1:8100
#
# Os blocos limit_req_zone e log_format ficam no contexto http {} (ex.: /etc/nginx/conf.d/gateway-http.conf):
#
#   limit_req_zone $binary_remote_addr zone=gw_webhook:10m rate=30r/s;
#   limit_req_zone $binary_remote_addr zone=gw_api:10m     rate=10r/s;
#   # SEG05: log sem query string (o segredo do webhook vai em ?s=)
#   log_format gw_sem_query '$remote_addr - [$time_local] "$request_method $uri" '
#                           '$status $body_bytes_sent $request_time';

# X-Real-IP / X-Forwarded-For são enviados em TODAS as rotas públicas. O gateway usa
# a presença deles para saber que a chamada veio da internet (e recusar rotas internas).

# Webhooks dos canais (uazapi, Meta, site)
location /gateway/webhooks/ {
    limit_req zone=gw_webhook burst=60 nodelay;
    client_max_body_size 2m;
    access_log /var/log/nginx/gateway.log gw_sem_query;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_pass http://127.0.0.1:8100/webhooks/;
}

# API de integração (Skills do Skyone e sistemas do cliente)
location /gateway/api/ {
    limit_req zone=gw_api burst=20 nodelay;
    client_max_body_size 1m;
    access_log /var/log/nginx/gateway.log gw_sem_query;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_pass http://127.0.0.1:8100/api/;
}

# Health público (responde só {"ok": true})
location = /gateway/health {
    access_log off;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://127.0.0.1:8100/health;
}

# Qualquer outra rota do gateway: bloqueada para a internet
location /gateway/ {
    return 404;
}
